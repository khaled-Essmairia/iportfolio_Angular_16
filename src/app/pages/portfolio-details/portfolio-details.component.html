<ng-container *ngIf="detail">

  <section id="breadcrumbs" class="breadcrumbs">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h2>Portfolio Details</h2>
        <ol>
          <li><a routerLink="/home">Home</a></li>
          <li>Portfolio Details</li>
        </ol>
      </div>
    </div>
  </section><!-- End Breadcrumbs -->

  <section id="portfolio-details" class="portfolio-details">
    <div class="container">

      <div class="row gy-4">

        <div class="col-lg-8">
          <div class="portfolio-details-slider swiper" #sliderEl>
            <div class="swiper-wrapper align-items-center">
              <div class="swiper-slide" *ngFor="let image of detail.images">
                <img [src]="image" alt="">
              </div>
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="portfolio-info">
            <h3>Project information</h3>
            <ul>
              <li><strong>Category</strong>: {{ detail.category }}</li>
            </ul>
          </div>
          <div class="portfolio-description">
            <h2>{{ detail.heading }}</h2>
            <p>{{ detail.description }}</p>
            <a routerLink="/home" class="btn btn-primary mt-3">
              <i class="bx bx-arrow-back"></i> Return Home
            </a>
          </div>
        </div>

      </div>

    </div>
  </section><!-- End Portfolio Details Section -->

</ng-container>
